.overlay{background:rgba(0,0,0,.55);min-height:100vh;padding:20px}
canvas{border:4px solid orange;background:rgba(255,255,255,.12)}
button,input{padding:10px;margin:5px;font-size:16px}
#leaderboard{max-width:400px;margin:10px auto;background:rgba(0,0,0,.5);padding:10px;border-radius:10px}
</style>
</head>
<body>
<div class="overlay">
<h1>🐶 Broke Dog Bone Hunt</h1>

<div id="login">
<input id="username" placeholder="Enter Username">
<button onclick="startGame()">Start Game</button>
</div>

<div id="hud" style="display:none;">
Score: <span id="score">0</span> |
Time: <span id="time">60</span>s
<br>
<button onclick="restartGame()">🔄 Restart Game</button>
</div>

<canvas id="game" width="900" height="550" style="display:none;"></canvas>

<div id="leaderboard">
<h3>🏆 Leaderboard</h3>
<ol id="scores"></ol>
</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const keys={};

let player,bones,score,timeLeft,gameOver,username;
let timerHandle=null;

function renderLeaderboard(){
 let scores=JSON.parse(localStorage.getItem('brokedog_leaderboard')||'[]');
 document.getElementById('scores').innerHTML=
 scores.map(s=>`<li>${s.name} - ${s.score}</li>`).join('');
}

function saveScore(){
 let scores=JSON.parse(localStorage.getItem('brokedog_leaderboard')||'[]');
 scores.push({name:username,score:score});
 scores.sort((a,b)=>b.score-a.score);
 scores=scores.slice(0,10);
 localStorage.setItem('brokedog_leaderboard',JSON.stringify(scores));
 renderLeaderboard();
}

function spawnBone(){
 bones.push({
   x:Math.random()*840+20,
   y:Math.random()*490+20
 });
}

function resetState(){
 player={x:420,y:250,w:50,h:50,speed:5};
 bones=[];
 score=0;
 timeLeft=60;
 gameOver=false;

 for(let i=0;i<20;i++) spawnBone();

 document.getElementById('score').textContent=score;
 document.getElementById('time').textContent=timeLeft;
}

function startGame(){
 username=document.getElementById('username').value.trim();
 if(!username){
   alert('Please enter a username');
   return;
 }

 document.getElementById('login').style.display='none';
 document.getElementById('hud').style.display='block';
 document.getElementById('game').style.display='inline-block';

 resetState();

 if(timerHandle) clearInterval(timerHandle);
 timerHandle=setInterval(()=>{
   if(gameOver) return;
   timeLeft--;
   document.getElementById('time').textContent=timeLeft;

   if(timeLeft<=0){
      gameOver=true;
      saveScore();
      alert('⏰ Time Up! Score: '+score);
   }
 },1000);
}

function restartGame(){
 resetState();
}

document.addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);
document.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

function update(){
 if(gameOver || !player) return;

 if(keys.w) player.y-=player.speed;
 if(keys.s) player.y+=player.speed;
 if(keys.a) player.x-=player.speed;
 if(keys.d) player.x+=player.speed;

 player.x=Math.max(0,Math.min(canvas.width-player.w,player.x));
 player.y=Math.max(0,Math.min(canvas.height-player.h,player.y));

 for(let i=bones.length-1;i>=0;i--){
   const b=bones[i];
   if(Math.abs((player.x+25)-b.x)<30 &&
      Math.abs((player.y+25)-b.y)<30){
      bones.splice(i,1);
      score++;
      document.getElementById('score').textContent=score;
      spawnBone();
   }
 }
}

function draw(){
 ctx.clearRect(0,0,canvas.width,canvas.height);
 if(!player) return;

 bones.forEach(b=>{
   ctx.font='28px Arial';
   ctx.fillText('🦴',b.x,b.y);
 });

 ctx.fillStyle='orange';
 ctx.fillRect(player.x,player.y,player.w,player.h);
 ctx.font='28px Arial';
 ctx.fillText('🐶',player.x+5,player.y+32);
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
renderLeaderboard();
loop();
</script>
</body>
</html>
